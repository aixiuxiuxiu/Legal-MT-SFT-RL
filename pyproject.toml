[project]
name = "vision-finetune"
version = "0.1.0"
description = "Fine-tuning Vision Language Models (VLMs)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "bitsandbytes>=0.47.0",
    "hf-transfer>=0.1.9",
    "ninja>=1.13.0",
    "peft>=0.19.1",
    "progrich>=0.2.0",
    "rich>=15.0.0",
    "simple-parsing>=0.1.8",
    "torchmetrics>=1.9.0",
    "torchvision>=0.25.0",
    # TODO: Remove the <5.15.0 once vLLM fixes the Gemma 4 issue with transformers 5.15.0
    "transformers>=5.5.0,<5.15.0",
    "unsloth",
    "vllm>=0.20.0",
    "wandb>=0.26.0",
    # For some reason higher versions don't have the necessary wheels.
    "xgrammar==0.2.3",
]


[dependency-groups]
dev = [
    "basedpyright>=1.27.0",
    "debugpy>=1.8.12",
    "pybind11>=2.13.6",
    "pytest>=8.3.4",
    "ruff>=0.9.6",
]
triton = [
  "triton>=3.6.0",
]
full = [
  {include-group = "triton"},
  "xformers>=0.0.35",
  "unsloth-zoo",
  # This is here and not above, because on arm64 in order to install compile triton you need PyTorch, but PyTorch itself
  # depends on triton, hence it wouldn't work. But if PyTorch is not specified when compiling triton, it uses the CPU
  # only version, which does not depend on triton. Sounds odd, but the custom registry only applies to direct
  # dependencies, not their dependencies.
  "torch>=2.10.0",
]

[tool.basedpyright]
typeCheckingMode = "standard"
reportPrivateImportUsage = false
reportMatchNotExhaustive = true
reportUnnecessaryComparison = true
# These need to be ignored separately, even though they are already in gitignore.
# Otherwise it tries to check all files in the virtual environment (.venv) or any
# of these generated directories.
exclude = [
  "**/__pycache__",
  ".ruff_cache/",
  ".cache/",
  ".venv/",
  "build",
  "log/",
  "unsloth_compiled_cache/",
]
# Automatically look in the virtual environment for packages
venv = ".venv"
venvPath = "."


[tool.pytest.ini_options]
testpaths = "test"

[tool.ruff.lint]
# Additionally include import sorting lints (and automatic formatting with --fix)
extend-select = ["I"]

[tool.uv]
no-build-isolation-package = ["triton", "xformers"]
# For some baffling reason, unsloth has transformers<5.5.0. But that is completely useless,
# since some newer models are only available in transformers 5.5.0.
# And apparently also torch < 2.13.0, so doesn't support the latest PyTorch version, even though they are no real
# breaking changes anymore in PyTorch.
# This overwrites that dependency requirement.
# TODO: See above for transformers <5.15.0
override-dependencies = ["transformers>5.5.0,<5.15.0", "torch>=2.13.0"]

[tool.uv.sources]
# torch = [
#   { index = "pytorch-cu129"},
# ]
# torchvision = [
#   { index = "pytorch-cu129"},
# ]
unsloth = { git = "https://github.com/unslothai/unsloth.git" }
unsloth-zoo = { git = "https://github.com/unslothai/unsloth-zoo.git" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

# This looks very unnecessary and noisy, but because these are built from source on aarch64,
# they are not installed by default, but uv still needs to know the build dependencies of them.
[[tool.uv.dependency-metadata]]
name = "triton"
requires-dist = ["setuptools", "pybind11"]

[[tool.uv.dependency-metadata]]
name = "xformers"
requires-dist = ["setuptools", "torch"]
